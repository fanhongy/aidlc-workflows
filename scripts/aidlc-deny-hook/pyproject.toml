[project]
name = "aidlc-deny-hook"
version = "0.1.0"
description = "Deny-dangerous hook for AI coding agents - blocks destructive commands, secret access, and repo writes"
requires-python = ">=3.11"
license = {text = "MIT-0"}
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
aidlc-deny-hook = "deny_hook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deny_hook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
